name: SaaS foundation checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:rls
      - run: npm run test:transactions
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npx eslint src/auth/AuthGate.tsx src/pages/AccountHome.tsx src/lib/supabase.ts src/lib/pos.ts src/pages/StoreWorkspace.tsx
      - run: npm run build
